<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenido a GeoWeb</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Three.js + Vanta.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta/dist/vanta.fog.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    .overlay {
      z-index: 1;
      position: relative;
    }
    .start-btn {
      font-size: 1.2rem;
      border-radius: 30px;
      padding: 10px 30px;
      background: #0077b6;
      border: none;
      color: #fff;
      transition: all 0.3s ease;
    }
    .start-btn:hover {
      transform: scale(1.1);
      background: #0096c7;
      box-shadow: 0 0 15px rgba(0, 150, 199, 0.6);
    }
  </style>
</head>
<body id="landing" class="vh-100 d-flex align-items-center justify-content-center text-white">
  <div class="text-center overlay fade-in">
    <img src="https://img.icons8.com/fluency/96/earth-planet.png" alt="GeoWeb logo" class="mb-4">
    <h1 class="display-2 fw-bold">GeoWeb</h1>
    <p class="lead mb-4">Explorando la Geodesia Física y Geométrica</p>
    <a href="index.html" class="btn start-btn">🚀 Comenzar</a>
  </div>

  <script>
    VANTA.FOG({
      el: "#landing",
      mouseControls: true,
      touchControls: true,
      highlightColor: 0xcccccc,   // gris claro
      midtoneColor: 0x666666,     // gris medio
      lowlightColor: 0x222222,    // gris oscuro
      baseColor: 0x000000,        // fondo negro
      blurFactor: 0.5,
      speed: 1.0,
      zoom: 1.2
    })
  </script>
</body>
</html>
